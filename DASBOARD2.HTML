<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0"/>
  <title>Dashboard PrePedidos</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">
  <script src="https://cdnjs.cloudflare.com/ajax/libs/html2pdf.js/0.10.1/html2pdf.bundle.min.js"></script>
  <script src="https://cdnjs.cloudflare.com/ajax/libs/xlsx/0.18.5/xlsx.full.min.js"></script>
  <style>
    body {
      background-color: #f4f6f9;
      font-family: 'Segoe UI', sans-serif;
    }
    .kpi-card {
      background-color: white;
      border-radius: 12px;
      padding: 20px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      text-align: center;
    }
    .kpi-card h2 {
      font-size: 2.2rem;
      margin-bottom: 10px;
    }
    .kpi-card p {
      margin: 0;
      color: #6c757d;
    }
    .chart-card {
      background-color: white;
      border-radius: 12px;
      padding: 15px;
      box-shadow: 0 2px 8px rgba(0,0,0,0.05);
      margin-bottom: 20px;
    }
    canvas {
      max-height: 300px;
    }
  </style>
</head>
<body>
<div class="container py-4" id="dashboard">
  <h1 class="mb-4">📊 Dashboard PrePedidos</h1>
  <div class="row mb-3">
    <div class="col-md-3"><input type="date" id="fIni" class="form-control" /></div>
    <div class="col-md-3"><input type="date" id="fFin" class="form-control" /></div>
    <div class="col-md-2 d-grid"><button onclick="cargarDatos()" class="btn btn-primary"><i class="bi bi-funnel"></i> Cargar</button></div>
 <!-- <div class="col-md-2 d-grid"><button onclick="exportarPDF()" class="btn btn-danger"><i class="bi bi-file-pdf"></i> PDF</button></div>-->  
    <div class="col-md-2 d-grid"><button onclick="exportarExcel()" class="btn btn-success"><i class="bi bi-file-earmark-excel"></i> Excel</button></div>
  </div>
  <div class="row g-3 mb-4">
    <div class="col-md-3"><div class="kpi-card"><h2 id="totalPares">0</h2><p>Total Pares</p></div></div>
    <div class="col-md-3"><div class="kpi-card"><h2 id="totalPedidos">0</h2><p>Total Pedidos</p></div></div>
    <div class="col-md-3"><div class="kpi-card"><h2 id="fabricanteTop">-</h2><p>Fabricante Top</p></div></div>
    <div class="col-md-3"><div class="kpi-card"><h2 id="clientesUnicos">0</h2><p>Clientes Únicos</p></div></div>
  </div>
  <div class="row">
    <div class="col-md-6"><div class="chart-card"><canvas id="chartVendedores"></canvas></div></div>
    <div class="col-md-6"><div class="chart-card"><canvas id="chartFabricantes"></canvas></div></div>
    <div class="col-md-6"><div class="chart-card"><canvas id="chartModelos"></canvas></div></div>
    <div class="col-md-6"><div class="chart-card"><canvas id="chartPreciosFabricante"></canvas></div></div>

  </div>
</div>
<script>
let url = '';
/*

function exportarExcel() {
  fetch(url)
    .then(resp => resp.json())
    .then(data => {
      const ws = XLSX.utils.json_to_sheet(data);
      const wb = XLSX.utils.book_new();
      XLSX.utils.book_append_sheet(wb, ws, 'PrePedidos');
      XLSX.writeFile(wb, 'Dashboard.xlsx');
    });
}

async function cargarDatos() {
  /* util fecha yyyy-mm-dd */
  /* ---------- fecha por defecto (mes actual) ---------- */

const fIniInput = document.getElementById('fIni');
const fFinInput = document.getElementById('fFin');


  url = `https://appsapventasapi.azurewebsites.net/api/ProcesoPrePedido/GetResumenPrePedidosAsync?fechaInicio=01/07/2025&fechaFin=31/12/2025`;

  try {
    const response = await fetch(url);
    const data = await response.json();
    renderDashboard(data);
  } catch (error) {
    alert('Error al obtener datos');
    console.error(error);
  }
}
function renderDashboard(data) {
  const vendedoresMap = {}, fabricantesMap = {}, modelosMap = {}, preciosMap = {}, coloresMap = {}, tallasMap = {}, clientesSet = new Set();
  let totalPares = 0;

  data.forEach(item => {
    const vendedor = item.codvendedor;
    const fabricante = item.nomFabricante;
    const modelo = item.modelo;
    const color = item.color;
    const tallas = (item.talla || '').split('/');
    const cliente = item.nomCliente;
    const curvas = parseInt(item.totalPares || 0);
    const precioSug = parseFloat(item.precioSugerido || 0);
    const precioMay = parseFloat(item.precioMayorista || 0);

    totalPares += curvas;
    vendedoresMap[vendedor] = (vendedoresMap[vendedor] || 0) + curvas;
    fabricantesMap[fabricante] = (fabricantesMap[fabricante] || 0) + 1;
    modelosMap[modelo] = (modelosMap[modelo] || 0) + curvas;
    coloresMap[color] = (coloresMap[color] || 0) + curvas;
    tallas.forEach(t => {
      const talla = t.trim();
      if (talla) tallasMap[talla] = (tallasMap[talla] || 0) + 1;
    });
    preciosMap[fabricante] = preciosMap[fabricante] || {sug: 0, may: 0, count: 0};
    preciosMap[fabricante].sug += precioSug;
    preciosMap[fabricante].may += precioMay;
    preciosMap[fabricante].count++;
    clientesSet.add(cliente);
  });

  document.getElementById('totalPares').textContent = totalPares;
  document.getElementById('totalPedidos').textContent = data.length;
  const topFabricante = Object.entries(fabricantesMap).sort((a, b) => b[1] - a[1])[0];
  document.getElementById('fabricanteTop').textContent = topFabricante ? topFabricante[0] : '-';
  document.getElementById('clientesUnicos').textContent = clientesSet.size;

  renderBarChart('chartVendedores', 'Pares por Vendedor', vendedoresMap);
  renderPieChart('chartFabricantes', 'Pedidos por Fabricante', fabricantesMap);
  renderBarChart('chartModelos', 'Pares por Modelo', modelosMap);
  renderGroupBarChart('chartPreciosFabricante', preciosMap);
}
function renderBarChart(canvasId, label, dataMap) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels: Object.keys(dataMap),
      datasets: [{ label, data: Object.values(dataMap), backgroundColor: '#4e73df' }]
    },
    options: { responsive: true, plugins: { legend: { display: false } } }
  });
}
function renderPieChart(canvasId, label, dataMap) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  new Chart(ctx, {
    type: 'pie',
    data: {
      labels: Object.keys(dataMap),
      datasets: [{ label, data: Object.values(dataMap), backgroundColor: ['#f6c23e', '#36b9cc', '#1cc88a', '#e74a3b', '#858796', '#5a5c69'] }]
    },
    options: { responsive: true }
  });
}
function renderGroupBarChart(canvasId, preciosMap) {
  const ctx = document.getElementById(canvasId).getContext('2d');
  const labels = Object.keys(preciosMap);
  const sugerido = labels.map(f => (preciosMap[f].sug / preciosMap[f].count).toFixed(2));
  const mayorista = labels.map(f => (preciosMap[f].may / preciosMap[f].count).toFixed(2));
  new Chart(ctx, {
    type: 'bar',
    data: {
      labels,
      datasets: [
        { label: 'Precio Sugerido', data: sugerido, backgroundColor: '#4e73df' },
        { label: 'Precio Mayorista', data: mayorista, backgroundColor: '#1cc88a' }
      ]
    },
    options: {
      responsive: true,
      scales: { x: { stacked: false }, y: { beginAtZero: true } }
    }
  });
}
</script>
</body>
</html>
