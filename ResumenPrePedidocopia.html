<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8"/>
  <meta name="viewport" content="width=device-width, initial-scale=1"/>
  <title>Resumen Pre-Pedido – Azaleia</title>

  <!-- Bootstrap 5 + iconos -->
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.11.3/font/bootstrap-icons.css">

  <style>
    :root{--az:#e66b00;--az-dark:#cc5200;--az-soft:#fff7f2;}

    body{font-family:'Segoe UI',sans-serif;background:var(--az-soft);}
    h2{color:var(--az-dark);margin-bottom:1rem;}

    /* tabla principal */
    .tabla-az{min-width:1000px;border-collapse:collapse;font-size:.85rem}
    .tabla-az thead th{background:var(--az);color:#fff;font-weight:700;padding:10px;
                       border:1px solid #d35800;position:sticky;top:0;z-index:2}
    .tabla-az tbody td{border:1px solid #e5e5e5;padding:8px 10px;white-space:nowrap}
    .tabla-az tbody tr:nth-child(even){background:#fafafa}
    .tabla-az tbody tr:hover{background:#e4f1ff}

    /* botón chevron */
    .chevron-btn{background:none;border:none;padding:0;color:var(--az-dark);cursor:pointer}
    .chevron-btn .bi{transition:transform .2s;transform:rotate(90deg)}
    .chevron-btn.collapsed .bi{transform:rotate(0deg)}

    /* detalle colapsable */
    .detalle-row{background:#fff6e9}
    .detalle-table thead th{background:#ffd8b8;color:#7a3d00;border:1px solid #e1b089;font-size:.74rem}
    .detalle-table tbody td{border:1px solid #e8d2bb;font-size:.8rem}

    /* filtros */
    .filter-bar{gap:15px;margin-bottom:20px;flex-wrap:wrap}
    .filter-bar input{border-radius:8px;padding:8px 12px;border:1px solid #ccc}
    .btn-az{background:var(--az);color:#fff;border:none;border-radius:6px;padding:8px 16px}
    .btn-az:hover{background:var(--az-dark)}

    .table-responsive-az{overflow-x:auto;width:100%}
  </style>
</head>
<body class="container-fluid py-4">

  <h2>Resumen de Pre-Pedidos</h2>

  <!-- filtros -->
  <div class="filter-bar d-flex align-items-center">
    <label class="form-label mb-0">Desde
      <input type="date" id="fIni">
    </label>
    <label class="form-label mb-0">Hasta
      <input type="date" id="fFin">
    </label>
    <button id="btnBuscar" class="btn-az">
      <i class="bi bi-search me-1"></i>Buscar
    </button>
  </div>

  <!-- tabla -->
  <div class="table-responsive-az">
    <table class="table tabla-az table-sm mb-0">
      <thead>
        <tr>
       
          <th>NomCliente</th>
          <th>NroDocumento</th><th>Vendedor</th>
          <th>Canal</th><th>CodFabricante</th><th>NomFabricante</th>
          <th>Modelo</th><th>Color</th><th>Curva</th><th>Talla</th><th>Cant. Curvas</th>
          <th class="text-end">Precio Sugerido</th><th class="text-end">Precio Mayorista</th>
        </tr>
      </thead>
      <tbody id="tbodyResumen"></tbody>
    </table>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>

  <script>
 

btnBuscar.addEventListener('click', cargarDatos);

window.addEventListener('DOMContentLoaded', () => {
    const fIni = document.getElementById('fIni');
    const fFin = document.getElementById('fFin');

    const hoy = new Date();
    const yyyy = hoy.getFullYear();
    const mm = String(hoy.getMonth() + 1).padStart(2, '0');

    // Día de inicio: 01
    const fechaInicio = `${yyyy}-${mm}-01`;

    // Día de fin: último día del mes
    const ultimoDia = new Date(yyyy, hoy.getMonth() + 1, 0).getDate(); // día 0 del siguiente mes = último día del mes actual
    const fechaFin = `${yyyy}-${mm}-${String(ultimoDia).padStart(2, '0')}`;

    // Cargar en los inputs
    fIni.value = fechaInicio;
    fFin.value = fechaFin;
    cargarDatos();
  });
/* ---------- formatea fecha para API (dd/MM/yyyy) ---------- */
function formatearFechaParaAPI(fechaISO) {
  const partes = fechaISO.split('-'); // [yyyy, mm, dd]
  return `${partes[2]}/${partes[1]}/${partes[0]}`; // dd/MM/yyyy
}

/* ---------------- CARGA ---------------- */
async function cargarDatos(){
   /* util fecha yyyy-mm-dd */
  /* ---------- fecha por defecto (mes actual) ---------- */

const fIniInput = document.getElementById('fIni');
const fFinInput = document.getElementById('fFin');
  const tbody = document.getElementById('tbodyResumen');


  tbody.innerHTML =
    '<tr><td colspan="13" class="text-center py-3">Cargando…</td></tr>';

  /* validación básica */
    if (fIniInput.value > fFinInput.value) {
      tbody.innerHTML =
        '<tr><td colspan="13" class="text-danger text-center py-3">La fecha inicio debe ser anterior a la fecha fin</td></tr>';
      return;
    }

    // Convertir al formato esperado por la API
    const fechaInicio = formatearFechaParaAPI(fIniInput.value);
    const fechaFin = formatearFechaParaAPI(fFinInput.value);
console.log(`Cargando datos desde ${fechaInicio} hasta ${fechaFin}`);
  const url =
    `https://appsapventasapi.azurewebsites.net/api/ProcesoPrePedido/GetResumenPrePedidosAsync` +
    `?fechaInicio=${encodeURIComponent(fechaInicio)}` +
    `&fechaFin=${encodeURIComponent(fechaFin)}`;

  try{
    const data = await fetch(url).then(r=>r.json());
    pintarTabla(data);
  }catch(e){
    console.error(e);
    tbody.innerHTML =
      '<tr><td colspan="13" class="text-danger text-center py-3">Error al cargar datos</td></tr>';
  }
}

/* ---------------- TABLA PLANA ---------------- */
function pintarTabla(lista){
  const tbody = document.getElementById('tbodyResumen');
  tbody.innerHTML = '';

  if(!lista?.length){
    tbody.innerHTML =
      '<tr><td colspan="13" class="text-center py-3">Sin datos</td></tr>';
    return;
  }

  lista.forEach(r=>{
    tbody.insertAdjacentHTML('beforeend',`
      <tr>
        <td>${r.nomCliente}</td>
        <td>${r.nroDocumento}</td>
        <td>${r.codvendedor}</td>
        <td>${r.canal}</td>
        <td>${r.codFabricante}</td>
        <td>${r.nomFabricante}</td>
        <td>${r.modelo}</td>
        <td>${r.color}</td>
        <td>${r.curva}</td>
        <td>${r.cadenaCurva}</td>
        <td class="text-center">${r.totalPares}</td>
        <td class="text-end">${r.precioSugerido.toFixed(2)}</td>
        <td class="text-end">${r.precioMayorista.toFixed(2)}</td>
      </tr>
    `);
  });
}
  </script>
</body>
</html>
