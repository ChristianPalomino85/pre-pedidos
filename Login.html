<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Iniciar Sesión – Azaleia</title>

  <!-- CSS -->
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap-icons@1.10.5/font/bootstrap-icons.css">
  <link rel="stylesheet" href="css/main.css">

  <!-- JavaScript -->
  <script src="https://cdn.jsdelivr.net/npm/sweetalert2@11"></script>
  <style>
    html, body {
      height: 100%;
      margin: 0;
    }

    body {
      background: linear-gradient(135deg, #fff 0%, #fbeee6 100%);
      display: flex;
      justify-content: center;
      align-items: center;
      padding: var(--space-3);
      animation: fadeInBody 0.6s ease-in-out;
      position: relative;
      overflow: hidden;
    }

    /* Efecto de círculos decorativos */
    body::before,
    body::after {
      content: '';
      position: absolute;
      border-radius: 50%;
      opacity: 0.15;
      z-index: 0;
    }

    body::before {
      width: 500px;
      height: 500px;
      background: radial-gradient(circle, var(--az-primary) 0%, transparent 70%);
      top: -200px;
      right: -200px;
    }

    body::after {
      width: 400px;
      height: 400px;
      background: radial-gradient(circle, var(--az-primary-light) 0%, transparent 70%);
      bottom: -150px;
      left: -150px;
    }

    @keyframes fadeInBody {
      from { opacity: 0; }
      to   { opacity: 1; }
    }

    .login-box {
      width: 100%;
      max-width: 440px;
      padding: var(--space-6) var(--space-5);
      background: rgba(255, 255, 255, 0.95);
      backdrop-filter: blur(10px);
      border-radius: var(--radius-xl);
      border: 2px solid rgba(212, 99, 33, 0.2);
      box-shadow: var(--shadow-xl);
      animation: fadeInCard 0.8s cubic-bezier(0.68, -0.55, 0.265, 1.55);
      position: relative;
      z-index: 1;
    }

    .login-box::before {
      content: '';
      position: absolute;
      inset: 0;
      border-radius: var(--radius-xl);
      padding: 2px;
      background: linear-gradient(135deg, var(--az-primary), var(--az-primary-light));
      -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
      -webkit-mask-composite: xor;
      mask-composite: exclude;
      opacity: 0.3;
    }

    .login-box img {
      max-width: 180px;
      height: auto;
      margin-bottom: var(--space-3);
      filter: drop-shadow(0 4px 8px rgba(0,0,0,0.1));
      transition: transform 0.3s ease;
    }

    .login-box img:hover {
      transform: scale(1.05);
    }

    @keyframes fadeInCard {
      from {
        opacity: 0;
        transform: scale(0.9) translateY(30px);
      }
      to {
        opacity: 1;
        transform: scale(1) translateY(0);
      }
    }

   

    h4 {
      font-weight: var(--font-weight-semibold);
      color: var(--az-gray-900);
      margin-bottom: var(--space-4);
      font-size: var(--font-size-2xl);
      text-align: center;
      position: relative;
      padding-bottom: var(--space-2);
    }

    h4::after {
      content: '';
      position: absolute;
      bottom: 0;
      left: 50%;
      transform: translateX(-50%);
      width: 60px;
      height: 3px;
      background: linear-gradient(90deg, var(--az-primary), var(--az-primary-light));
      border-radius: 2px;
    }

    .form-label {
      font-weight: var(--font-weight-medium);
      color: var(--az-gray-700);
      margin-bottom: var(--space-1);
      font-size: var(--font-size-sm);
    }

    .form-control {
      height: 52px;
      font-size: var(--font-size-base);
      border: 2px solid var(--az-gray-300);
      border-radius: var(--radius-base);
      padding: 0 1rem;
      transition: all var(--transition-base);
    }

    .form-control:focus {
      border-color: var(--az-primary);
      box-shadow: 0 0 0 4px rgba(212, 99, 33, 0.1);
      outline: none;
    }

    .btn-orange {
      background: linear-gradient(135deg, var(--az-primary) 0%, var(--az-primary-dark) 100%);
      border: none;
      color: var(--az-white);
      font-weight: var(--font-weight-medium);
      border-radius: var(--radius-base);
      padding: 0.875rem 1.5rem;
      font-size: var(--font-size-base);
      transition: all var(--transition-base);
      box-shadow: var(--shadow-sm);
      position: relative;
      overflow: hidden;
    }

    .btn-orange::before {
      content: '';
      position: absolute;
      inset: 0;
      background: linear-gradient(135deg, var(--az-primary-dark) 0%, var(--az-primary-darker) 100%);
      opacity: 0;
      transition: opacity var(--transition-base);
    }

    .btn-orange:hover::before {
      opacity: 1;
    }

    .btn-orange:hover {
      transform: translateY(-2px);
      box-shadow: var(--shadow-orange);
    }

    .btn-orange:active {
      transform: translateY(0);
    }

    .btn-orange span {
      position: relative;
      z-index: 1;
    }

    .text-end a {
      font-size: var(--font-size-sm);
      color: var(--az-primary-dark);
      font-weight: var(--font-weight-medium);
      transition: all var(--transition-fast);
      text-decoration: none;
      position: relative;
    }

    .text-end a::after {
      content: '';
      position: absolute;
      bottom: -2px;
      left: 0;
      width: 0;
      height: 2px;
      background: var(--az-primary);
      transition: width var(--transition-base);
    }

    .text-end a:hover {
      color: var(--az-primary);
      text-decoration: none;
    }

    .text-end a:hover::after {
      width: 100%;
    }

    .password-toggle {
      position: absolute;
      right: 10px;
      top: 50%;
      transform: translateY(-50%);
      background: none;
      border: none;
      font-size: 1rem;
      cursor: pointer;
      color: #d46321;
    }

    @media (max-width: 768px) {
      .login-box {
        padding: 32px 24px;
      }
    }

    @media (max-width: 480px) {
      .login-box {
        padding: 24px 18px;
      }

      h4 {
        font-size: 1.2rem;
      }

      .form-control,
      .btn-orange {
        font-size: 1rem;
        height: 48px;
      }

      .text-end a {
        font-size: 0.85rem;
      }
    }
    #passwordInput {
  padding-right: 2.5rem;
}
.btn-link:focus {
  box-shadow: none;
}

.input-group-text {
  background-color: transparent;
  border-left: 0;
}
  </style>
</head>
<body>
  <div class="login-box">
    <div class="text-center mb-4">
      <img src="img/azalaeia.jpeg" alt="Logo">
    </div>
    <h4>Iniciar sesión</h4>

    <form id="login-form" novalidate>
      <div class="mb-3">
        <label for="usuario" class="form-label">Usuario</label>
        <input type="text" class="form-control" id="usuario" required autocomplete="username">
      </div>
    <div class="mb-3">
          <label for="passwordInput" class="form-label">Contraseña</label>
          <div class="input-group">
            <input type="password" class="form-control" id="passwordInput" required autocomplete="current-password">
            <span class="input-group-text bg-white border-start-0">
              <button type="button" class="btn btn-link p-0 m-0 text-secondary" onclick="togglePassword()" tabindex="-1" style="font-size: 1.2rem;">
                <i class="bi bi-eye" id="eyeIcon"></i>
              </button>
            </span>
          </div>
  </div>
      <button type="submit" class="btn btn-orange w-100">
        <span>Iniciar sesión</span>
      </button>
    </form>

    <div class="text-end mt-2">
      <a href="#" data-bs-toggle="modal" data-bs-target="#detalleModal">¿Olvidaste tu contraseña?</a>
    </div>
  </div>

  <!-- Modal -->
  <div class="modal fade" id="detalleModal" tabindex="-1" aria-labelledby="detalleModalLabel" aria-hidden="true">
    <div class="modal-dialog modal-md modal-dialog-centered">
      <div class="modal-content">
        <div class="modal-header">
          <h5 class="modal-title">Recuperar contraseña</h5>
          <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Cerrar"></button>
        </div>
        <div class="modal-body">
          <p>Ingresa tu correo para restablecer tu contraseña:</p>
          <input type="email" class="form-control" id="correo-recuperacion" placeholder="ejemplo@dominio.com" required>
        </div>
        <div class="modal-footer">
          <button type="button" class="btn btn-secondary" data-bs-dismiss="modal">Cancelar</button>
          <button type="button" class="btn btn-primary" onclick="enviarCorreoRecuperacion()">Enviar</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/js/bootstrap.bundle.min.js"></script>
  <script src="js/components.js"></script>
  <script>

    function togglePassword() {
    const passwordInput = document.getElementById("passwordInput");
  const eyeIcon = document.getElementById("eyeIcon");

  const isHidden = passwordInput.type === "password";
  passwordInput.type = isHidden ? "text" : "password";
  eyeIcon.className = isHidden ? "bi bi-eye-slash" : "bi bi-eye";
}
    async function iniciarSesion(evt) {
      evt.preventDefault();
      localStorage.clear();

      const usuario = document.getElementById('usuario').value.trim();
      const password = document.getElementById('passwordInput').value.trim();

      if (!usuario || !password) {
        Swal.fire({
          icon: 'warning',
          title: 'Campos requeridos',
          text: 'Por favor, ingresa usuario y contraseña.'
        });
        return;
      }

      Swal.fire({ title: 'Verificando...', allowOutsideClick: false, didOpen: () => Swal.showLoading() });

      try {
        const resp = await fetch('https://appsapventasapi.azurewebsites.net/api/usuario/GetIniciarSesion', {
          method: 'POST',
          headers: { 'Content-Type': 'application/json' },
          body: JSON.stringify({ usuario, password })
        });

        Swal.close();

        if (!resp.ok) {
          let mensaje = 'Usuario o contraseña incorrectos.';
          try {
            const errorJson = await resp.clone().json();
            if (errorJson?.mensaje) mensaje = errorJson.mensaje;
          } catch {}

          Swal.fire({ icon: 'error', title: 'Acceso denegado', text: mensaje });
          return;
        }

        const data = await resp.json();
        if (data.error === "Error en la credenciales") {
          Swal.fire({ icon: 'error', title: 'Ingrese usuario/password correcto.', text: 'Error en las credenciales' });
        } else {
          localStorage.setItem('usuario', data.usuario);
          localStorage.setItem('rol', data.rol);
           localStorage.setItem('area', data.area);
window.location.href = 'https://vteximagenes.blob.core.windows.net/proyectohtml/Dasboard.html';
 //window.location.href = 'file:///C:/Users/amendoza/OneDrive%20-%20CALZADOS%20AZALEIA%20PERU%20S.A/Escritorio/Proyecto%20Html/Dasboard.html';
          
        }

      } catch (error) {
        Swal.close();
        Swal.fire({ icon: 'error', title: 'Error de red', text: 'Ocurrió un problema de conexión. Intenta nuevamente.' });
     //   console.error(error);
      }
    }

    async function enviarCorreoRecuperacion() {
      const correo = document.getElementById('correo-recuperacion').value.trim();
      const regexCorreo = /^[^\s@]+@[^\s@]+\.[^\s@]+$/;

      if (!regexCorreo.test(correo)) {
        Swal.fire({
          icon: 'warning',
          title: 'Correo inválido',
          text: 'Por favor, ingresa un correo válido.'
        });
        return;
      }

      // Aquí puedes agregar tu llamada real a la API
    //  console.log('Enviando correo a:', correo);

      const modal = bootstrap.Modal.getInstance(document.getElementById('detalleModal'));
      modal.hide();

      Swal.fire({
        icon: 'success',
        title: 'Correo enviado',
        text: 'Hemos enviado un enlace para restablecer tu contraseña.',
        confirmButtonText: 'Aceptar'
      });
    }

    document.getElementById('login-form').addEventListener('submit', iniciarSesion);
  </script>
</body>
</html>
